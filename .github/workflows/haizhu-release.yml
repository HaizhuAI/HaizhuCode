# HaizhuCode release pipeline.
#
# Every tagged version is a release: push a v* tag and this job builds the
# signed release APK and publishes it on the GitHub release for that tag,
# with the notes from docs/releases/<tag>.md when the file exists.
#
# Convention: one change = one version. Bump `version:` in pubspec.yaml
# (x.y.z+N), write docs/releases/v<x.y.z+N>.md, tag v<x.y.z+N>, push the tag.
# See docs/releasing.md.
#
# Secrets used (set once per repo):
#   HZ_KEYSTORE_BASE64  – the sideload signing keystore, base64 encoded
#   HZ_STORE_PASSWORD   – keystore password
#   HZ_KEY_PASSWORD     – key password
#   HZ_KEY_ALIAS        – key alias (androiddebugkey for the current lineage)
# Without HZ_KEYSTORE_BASE64 the job fails closed rather than shipping a
# differently-signed APK that cannot install over previous releases.

name: HaizhuCode release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: haizhu-release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.47.1"
  NDK_VERSION: "28.2.13676358"
  SIDELOAD_CERT_SHA256: 24CE74B61F293402F98483AFBA7745CC95F5E3D538DEEA2DF8DEB5AEA91C6D19

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Require the signing keystore secret
        run: |
          if [ -z "${HZ_KEYSTORE_B64}" ]; then
            echo "::error::HZ_KEYSTORE_BASE64 secret is not set; refusing to"
            echo "::error::publish an APK signed by a different lineage."
            exit 1
          fi
        env:
          HZ_KEYSTORE_B64: ${{ secrets.HZ_KEYSTORE_BASE64 }}

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK pieces
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$(command -v sdkmanager \
            || echo "$SDK/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platforms;android-37.0" "ndk;${NDK_VERSION}" \
            "build-tools;36.0.0"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Restore the signing config
        run: |
          echo "${HZ_KEYSTORE_B64}" | base64 -d > android/release-debug.keystore
          {
            echo "storePassword=${HZ_STORE_PASSWORD}"
            echo "keyPassword=${HZ_KEY_PASSWORD}"
            echo "keyAlias=${HZ_KEY_ALIAS}"
            echo "storeFile=../release-debug.keystore"
          } > android/key.properties
        env:
          HZ_KEYSTORE_B64: ${{ secrets.HZ_KEYSTORE_BASE64 }}
          HZ_STORE_PASSWORD: ${{ secrets.HZ_STORE_PASSWORD }}
          HZ_KEY_PASSWORD: ${{ secrets.HZ_KEY_PASSWORD }}
          HZ_KEY_ALIAS: ${{ secrets.HZ_KEY_ALIAS }}

      - name: Build the release APK
        run: |
          flutter pub get
          flutter build apk --release

      - name: Verify signer lineage and version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          want_version="${tag%+*}"
          want_code="${tag#*+}"
          got="$(grep '^version:' pubspec.yaml | tr -d 'version: ')"
          if [ "$got" != "${want_version}+${want_code}" ]; then
            echo "::error::pubspec version '$got' does not match tag '$tag'"
            exit 1
          fi
          apk=build/app/outputs/flutter-apk/app-release.apk
          signer="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" \
            -name apksigner | sort | tail -1)"
          fp="$("$signer" verify --print-certs "$apk" \
            | awk '/SHA-256 digest/ {h=$NF; gsub(/:/,"",h); print toupper(h); exit}')"
          if [ "$fp" != "$SIDELOAD_CERT_SHA256" ]; then
            echo "::error::signer $fp does not match lineage $SIDELOAD_CERT_SHA256"
            exit 1
          fi

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          notes="docs/releases/${tag}.md"
          apk="HaizhuCode-release.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$apk"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber
          elif [ -f "$notes" ]; then
            gh release create "$tag" --title "HaizhuCode ${tag#v}" \
              --notes-file "$notes" "$apk"
          else
            gh release create "$tag" --title "HaizhuCode ${tag#v}" \
              --generate-notes "$apk"
          fi
